<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}fling{% endblock %}</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        surface: {
                            DEFAULT: '#1e1e2e',
                            light: '#313244',
                            lighter: '#45475a',
                        },
                        accent: {
                            DEFAULT: '#89b4fa',
                            dim: '#585b70',
                        },
                        method: {
                            get: '#a6e3a1',
                            post: '#f9e2af',
                            put: '#89b4fa',
                            patch: '#94e2d5',
                            delete: '#f38ba8',
                            head: '#cba6f7',
                            options: '#6c7086',
                        },
                        status: {
                            success: '#a6e3a1',
                            redirect: '#f9e2af',
                            error: '#f38ba8',
                        }
                    }
                }
            }
        }
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>

    <!-- Prism.js for syntax highlighting -->
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markup.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>

    <style>
        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e2e; }
        ::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #585b70; }

        /* Pre/code blocks */
        pre[class*="language-"] {
            margin: 0;
            border-radius: 0.375rem;
            font-size: 0.875rem;
        }

        /* Active request in tree */
        .request-item.active {
            background-color: #313244;
            border-left-color: #89b4fa;
        }

        /* SSE loading animation */
        .sse-loading {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Tab styles */
        .tab-btn.active {
            border-bottom-color: #89b4fa;
            color: #cdd6f4;
        }
        .tab-btn {
            border-bottom: 2px solid transparent;
            color: #6c7086;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>

    <script>
        // Re-highlight Prism after HTMX swaps
        document.addEventListener('htmx:afterSwap', function() {
            Prism.highlightAll();
        });

        // Tab switching
        function switchTab(tabGroup, tabName) {
            const group = document.querySelector(`[data-tab-group="${tabGroup}"]`);
            if (!group) return;
            group.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabName);
            });
            group.querySelectorAll('.tab-content').forEach(content => {
                content.classList.toggle('active', content.dataset.tab === tabName);
            });
        }
    </script>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-surface-light border-b border-surface-lighter px-4 py-2 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
            <h1 class="text-lg font-bold text-accent">fling</h1>
            {% block header_extra %}{% endblock %}
        </div>
        <div class="flex items-center gap-2 text-sm text-accent-dim">
            {% block header_right %}{% endblock %}
        </div>
    </header>

    <!-- Main content -->
    <main class="flex-1 flex overflow-hidden">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
