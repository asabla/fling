<!-- Execution log: scrollable log of Run All results -->
<div id="execution-log" class="h-full flex flex-col">
    <div class="flex items-center justify-between px-4 py-2 border-b border-surface-lighter shrink-0">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-accent-dim">Execution Log</h3>
        <div id="execution-summary" class="text-xs text-accent-dim"></div>
    </div>
    <div id="execution-log-entries" class="flex-1 overflow-y-auto p-2 space-y-1">
        <div class="flex items-center justify-center h-full text-accent-dim text-sm">
            <p>Click "Run All" to execute all requests.</p>
        </div>
    </div>
</div>
